<!doctype html>
<html lang="fr">
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
<body>
  <header>
    <b>ChatGPT bridge</b>
    <span id="pill" class="pill">…</span>
  </header>

  <div id="pause"></div>

  <!-- the one thing to read: what the bridge is doing now, step by step, and what the extension reads in the tab -->
  <section id="now" class="now"></section>
  <div id="queue" class="queue"></div>

  <details>
    <summary>Onglet de travail</summary>
    <div id="tabs" class="list"></div>
    <div class="row">
      <button id="newtab">Nouvel onglet ChatGPT</button>
      <button id="untarget">Aucun</button>
    </div>
  </details>

  <details>
    <summary>Historique</summary>
    <div id="history" class="list"></div>
    <div class="row"><button id="clear">Effacer l’historique</button></div>
  </details>

  <details>
    <summary>Réglages et sujets</summary>
    <div class="row between">
      <span>Effort de réflexion</span>
      <div class="seg" id="effort"><button data-v="low">Léger</button><button data-v="medium">Moyen</button><button data-v="high">Élevé</button></div>
    </div>
    <label class="row between"><span>Nouvelle conversation à chaque image (sauf sujet)</span><input type="checkbox" id="newchat" /></label>
    <label class="row between"><span>Ouvrir un onglet ChatGPT si aucun ne répond</span><input type="checkbox" id="autoopen" /></label>
    <div class="sub">Sujets (un sujet = une conversation)</div>
    <div id="topics" class="list"></div>
  </details>

  <footer id="foot"></footer>
  <script src="popup.js"></script>
</body>
</html>
